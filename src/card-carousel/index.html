<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card carousel</title>
  <link rel="stylesheet" href="./../index.css">
  <link rel="stylesheet" href="./card-carousel.css">
</head>

<body>
  <h1>Card carousel</h1>
  <div>
    <button class="backward-button">atras</button>
    <button class="forward-button">adelante</button>
  </div>
  <div class="card-carousel-container" style="min-height: 40vh;">
    <div class="card-carousel-grid">
      <div class="card-carousel" style="background-color: #d6f7f7;">
        <h2>Card 1</h2>
        <p>This is the first card.</p>
      </div>
      <div class="card-carousel" style="background-color: #e7d7f0;">
        <h2>Card 2</h2>
        <p>This is the second card.</p>
      </div>
      <div class="card-carousel" style="background-color: #D7F0D8;">
        <h2>Card 3</h2>
        <p>This is the third card.</p>
      </div>
      <div class="card-carousel" style="background-color: #F0D7D7;">
        <h2>Card 4</h2>
        <p>This is the fourth card.</p>
      </div>
      <div class="card-carousel" style="background-color: #F0E7D7;">
        <h2>Card 5</h2>
        <p>This is the fifth card.</p>
      </div>
      <div class="card-carousel" style="background-color: #D7E7F0;">
        <h2>Card 6</h2>
        <p>This is the sixth card.</p>
      </div>
      <div class="card-carousel" style="background-color: #F0D7E7;">
        <h2>Card 7</h2>
        <p>This is the seventh card.</p>
      </div>
    </div>
  </div>
  <div class="bullet-container">
    <div class="bullet page-1 active"></div>
    <div class="bullet page-2"></div>
    <div class="bullet page-3"></div>
  </div>
  <script src="./card-carousel.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      new CardCarousel({
        selector: '.card-carousel-container',
        backwardButton: '.backward-button',
        forwardButton: '.forward-button',
        cardsPerSlide: { sm: 1, md: 2, lg: 3 },
        autoPlay: true,
        autoPlayInterval: 3000,
        onSlideChange: function (currentSlide, slideSize) {
          console.log('Current slide:', currentSlide, 'Slide size:', slideSize);

          const bullets = document.querySelectorAll('.bullet-container .bullet');
          bullets.forEach(bullet => bullet.classList.remove('active'));
          const activeBullet = document.querySelector(`.bullet.page-${currentSlide + 1}`);
          if (activeBullet) {
            activeBullet.classList.add('active');
          };
        },
        onLoaded: function (goToPage) {
          document.querySelectorAll('.bullet-container .bullet').forEach((bullet, index) => {
            bullet.addEventListener('click', function () {
              goToPage(index);
            });
          });
        }
      });
    });
  </script>
</body>

</html>
